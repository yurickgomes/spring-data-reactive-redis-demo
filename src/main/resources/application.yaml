spring:
  application:
    name: redis-poc
  data:
    redis:
      host: localhost
      port: 6379
      ssl:
        enabled: false # just for local testing
      # masterreplica:
      #   nodes: localhost:6379,localhost:6380
      cluster:
        nodes: localhost:6379 # in environments like aws elasticache, only the configuration endpoint is needed
      # pool only helpful when using sync client
      # lettuce:
      #   pool:
      #     enabled: true
      #     max-active: 8
      #     max-idle: 8
      #     min-idle: 0
      #     max-wait: -1

management:
  endpoints:
    web:
      exposure:
        include: health,prometheus,metrics
